# deploy/nginx/retail_analytics.conf
#
# Nginx reverse proxy in front of Gunicorn. Install to
# /etc/nginx/sites-available/retail_analytics.conf and symlink into
# sites-enabled, or include from your main nginx.conf.
#
# Replace `your-domain.example.com` and the certificate paths before
# using this in production. See INSTALLATION_GUIDE.md for the full
# setup (including obtaining a certificate via Let's Encrypt/certbot).

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.example.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10M;  # matches Flask's MAX_CONTENT_LENGTH (Phase 1) with headroom

    access_log /var/log/nginx/retail_analytics_access.log;
    error_log  /var/log/nginx/retail_analytics_error.log;

    # Static files served directly by nginx -- never proxied to
    # Gunicorn. Point this at your actual deployment path.
    location /static/ {
        alias /path/to/Retail_Analytics_System/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # X-Forwarded-For / X-Forwarded-Proto / X-Forwarded-Host:
        # app.py's ProxyFix (Phase 1) is configured to trust exactly
        # one proxy hop reading these -- if you add a second proxy
        # (e.g. a load balancer in front of this nginx), update
        # ProxyFix's x_for/x_proto/x_host counts in app.py to match,
        # or IP logging (Phase 1 audit logs) and rate limiting
        # (Phase 1 Flask-Limiter) will see the wrong client IP.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;  # matches Gunicorn's `timeout` in gunicorn.conf.py
    }

    # Defense-in-depth at the proxy layer too (app.py already sets
    # these on every response -- see SECURITY_GUIDE.md -- this just
    # ensures they're present even for anything nginx serves directly,
    # like the /static/ location above).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
