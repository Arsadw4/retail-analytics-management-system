{% extends 'layouts/admin_shell.html' %}
{% block page_content %}
    <div class="legacy-page">
        <div class="container">
            <div class="form-card">
                <div class="header">
                    <h1>
                        Add Customer
                    </h1>
                    <p>
                        Add new customer information to your Retail Analytics System
                    </p>
                </div>
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="form-group">
                        <label>
                            Customer Name
                        </label>
                        <input type="text"
                       name="name"
                       class="form-control"
                       required>
                    </div>
                    <div class="form-group">
                        <label>
                            Phone Number
                        </label>
                        <input type="text"
                       name="phone"
                       class="form-control">
                    </div>
                    <div class="form-group">
                        <label>
                            Email Address
                        </label>
                        <input type="email"
                       name="email"
                       class="form-control">
                    </div>
                    <div class="form-group">
                        <label>
                            Address
                        </label>
                        <textarea name="address"
                          class="form-control">
                        </textarea>
                    </div>
                    <div class="button-group">
                        <button type="submit" class="btn-save">
                            Save Customer
                        </button>
                        <a href="/admin/customers" class="btn-back">
                            Back
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
