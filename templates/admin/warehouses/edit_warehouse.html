{% extends 'layouts/admin_shell.html' %}
{% block page_content %}
    <div class="legacy-page">
        <div class="container" style="max-width:600px;">
            <div class="header">
                <h1>
                    Edit Warehouse
                </h1>
                <a href="/admin/warehouses" class="btn secondary">
                    Back
                </a>
            </div>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label>
                        Warehouse Name
                    </label>
                    <input type="text" name="warehouse_name" value="{{ warehouse[1] }}" required>
                </div>
                <div class="form-group">
                    <label>
                        Location
                    </label>
                    <input type="text" name="location" value="{{ warehouse[2] or '' }}">
                </div>
                <div class="form-group">
                    <label>
                        Contact Person
                    </label>
                    <input type="text" name="contact_person" value="{{ warehouse[3] or '' }}">
                </div>
                <div class="form-group">
                    <label>
                        Contact Phone
                    </label>
                    <input type="text" name="contact_phone" value="{{ warehouse[4] or '' }}">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" name="is_active" style="width:auto;display:inline;"
                {% if warehouse[5] %}checked{% endif %}>
                        Active
                    </label>
                </div>
                <button class="btn success" type="submit">
                    Update Warehouse
                </button>
            </form>
        </div>
    </div>
{% endblock %}
