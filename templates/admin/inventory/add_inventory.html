{% extends 'layouts/admin_shell.html' %}
{% block page_content %}
    <div class="legacy-page">
        <div class="container">
            <div class="header">
                <h1>
                    Add Inventory
                </h1>
                <a href="/admin/inventory" class="back-btn">
                    Back
                </a>
            </div>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label>
                        Product
                    </label>
                    <select name="product_id" required>
                        {% for p in products %}
                            <option value="{{ p[0] }}">
                                {{ p[2] }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <!--
            Current stock, purchase price, and selling price are no
            longer set here -- they belong to the product record
            itself (Products > Add/Edit Product) and are shown live
            on the Inventory page. Only reorder thresholds are
            inventory-specific.
        -->
                <div class="form-group">
                    <label>
                        Minimum Stock
                    </label>
                    <input type="number" name="minimum_stock" required>
                </div>
                <div class="form-group">
                    <label>
                        Maximum Stock
                    </label>
                    <input type="number" name="maximum_stock" required>
                </div>
                <button class="btn">
                    Save Inventory
                </button>
            </form>
        </div>
    </div>
{% endblock %}
