{% extends 'layouts/admin_shell.html' %}
{% block page_content %}
    <div class="legacy-page">
        <div class="container" style="max-width:600px;">
            <div class="header">
                <h1>
                    Stock Out
                </h1>
                <a href="/admin/inventory" class="btn secondary">
                    Back
                </a>
            </div>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label>
                        Product
                    </label>
                    <select name="product_id" required>
                        {% for p in products %}
                            <option value="{{ p[0] }}" {% if preselect == p[0] %}selected{% endif %}>
                                {{ p[2] }} (Stock: {{ p[5] }})
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>
                        Warehouse (optional)
                    </label>
                    <select name="warehouse_id">
                        <option value="">
                            -- Not specified --
                        </option>
                        {% for w in warehouses %}
                            <option value="{{ w[0] }}">
                                {{ w[1] }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>
                        Quantity to Remove
                    </label>
                    <input type="number" name="quantity" min="1" required>
                </div>
                <div class="form-group">
                    <label>
                        Reason
                    </label>
                    <input type="text" name="reason" placeholder="e.g. Damaged, Expired, Internal use">
                </div>
                <button class="btn warning" type="submit">
                    Remove Stock
                </button>
            </form>
        </div>
    </div>
{% endblock %}
