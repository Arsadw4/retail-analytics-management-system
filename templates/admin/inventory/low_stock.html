{% extends 'layouts/admin_shell.html' %}
{% block page_content %}
    <div class="legacy-page">
        <div class="container">
            <h1>
                Low Stock Products
            </h1>
            <table>
                <tr>
                    <th>
                        ID
                    </th>
                    <th>
                        Product
                    </th>
                    <th>
                        Current Stock
                    </th>
                    <th>
                        Minimum Stock
                    </th>
                </tr>
                {% for item in items %}
                    <tr>
                        <td>
                            {{ item[0] }}
                        </td>
                        <td>
                            {{ item[1] }}
                        </td>
                        <td>
                            {{ item[2] }}
                        </td>
                        <td>
                            {{ item[3] }}
                        </td>
                    </tr>
                {% endfor %}
            </table>
        </div>
    </div>
{% endblock %}
