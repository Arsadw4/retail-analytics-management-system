{% extends 'layouts/admin_shell.html' %}
{% block page_content %}
    <div class="legacy-page">
        <div class="container">
            <div class="header">
                <h1>
                    Edit Inventory
                </h1>
                <a href="/admin/inventory" class="back-btn">
                    Back
                </a>
            </div>
            <!--
        Product name, current stock, and prices are shown here for
        context only -- they are owned by the product record now
        (Products > Edit Product) and are no longer editable from
        the Inventory form. Only reorder thresholds are inventory-
        specific and editable here.
    -->
            <div class="form-group">
                <label>
                    Product
                </label>
                <input type="text" value="{{ item[2] }}" disabled>
            </div>
            <div class="form-group">
                <label>
                    Current Stock (read-only)
                </label>
                <input type="text" value="{{ item[3] }}" disabled>
            </div>
            <div class="form-group">
                <label>
                    Purchase Price (read-only)
                </label>
                <input type="text" value="{{ item[4] }}" disabled>
            </div>
            <div class="form-group">
                <label>
                    Selling Price (read-only)
                </label>
                <input type="text" value="{{ item[5] }}" disabled>
            </div>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label>
                        Minimum Stock
                    </label>
                    <input
            type="number"
            name="minimum_stock"
            value="{{ item[6] }}"
            required>
                </div>
                <div class="form-group">
                    <label>
                        Maximum Stock
                    </label>
                    <input
            type="number"
            name="maximum_stock"
            value="{{ item[7] }}"
            required>
                </div>
                <button class="btn">
                    Update Inventory
                </button>
            </form>
        </div>
    </div>
{% endblock %}
