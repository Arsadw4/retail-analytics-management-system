{% extends 'layouts/admin_shell.html' %}
{% block page_content %}
    <div class="legacy-page">
        <div class="container" style="max-width:600px;">
            <div class="header">
                <h1>
                    Add Batch
                </h1>
                <a href="/admin/inventory/batches" class="btn secondary">
                    Back
                </a>
            </div>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label>
                        Product
                    </label>
                    <select name="product_id" required>
                        {% for p in products %}
                            <option value="{{ p[0] }}">
                                {{ p[2] }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>
                        Batch Number
                    </label>
                    <input type="text" name="batch_number" required>
                </div>
                <div class="form-group">
                    <label>
                        Quantity Received
                    </label>
                    <input type="number" name="quantity" min="1" required>
                </div>
                <div class="form-group">
                    <label>
                        Manufacture Date
                    </label>
                    <input type="date" name="manufacture_date">
                </div>
                <div class="form-group">
                    <label>
                        Expiry Date
                    </label>
                    <input type="date" name="expiry_date">
                </div>
                <div class="form-group">
                    <label>
                        Warehouse (optional)
                    </label>
                    <select name="warehouse_id">
                        <option value="">
                            -- Not specified --
                        </option>
                        {% for w in warehouses %}
                            <option value="{{ w[0] }}">
                                {{ w[1] }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <button class="btn success" type="submit">
                    Save Batch (adds to stock)
                </button>
            </form>
        </div>
    </div>
{% endblock %}
