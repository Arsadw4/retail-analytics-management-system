{% extends 'layouts/admin_shell.html' %}
{% block page_content %}
    <div class="legacy-page">
        <div class="container">
            <div class="header">
                <h1>
                    Add User
                </h1>
                <a href="/admin/users" class="back-btn">
                    ← Back
                </a>
            </div>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label>
                        Full Name
                    </label>
                    <input type="text" name="full_name" required>
                </div>
                <div class="form-group">
                    <label>
                        Email
                    </label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>
                        Password
                    </label>
                    <input type="password" name="password" required>
                </div>
                <div class="form-group">
                    <label>
                        Role
                    </label>
                    <select name="role">
                        <option value="admin">
                            Admin
                        </option>
                        <option value="manager">
                            Manager
                        </option>
                        <option value="cashier">
                            Cashier
                        </option>
                        <option value="inventory_manager">
                            Inventory Manager
                        </option>
                        <option value="hr">
                            HR
                        </option>
                        <option value="accountant">
                            Accountant
                        </option>
                        <option value="employee">
                            Employee
                        </option>
                    </select>
                </div>
                <button class="btn">
                    Create User
                </button>
            </form>
        </div>
    </div>
{% endblock %}
