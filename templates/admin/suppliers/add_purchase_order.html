{% extends 'layouts/admin_shell.html' %}
{% block page_content %}
    <div class="legacy-page">
        <div class="container">
            <div class="header">
                <h1>
                    New Purchase Order
                </h1>
                <a href="/admin/purchase-orders" class="btn secondary">
                    Back
                </a>
            </div>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label>
                        Supplier
                    </label>
                    <select name="supplier_id" required>
                        {% for s in suppliers %}
                            <option value="{{ s[0] }}">
                                {{ s[1] }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>
                        Expected Date
                    </label>
                    <input type="date" name="expected_date">
                </div>
                <div class="form-group">
                    <label>
                        Notes
                    </label>
                    <input type="text" name="notes">
                </div>
                <h3 style="margin:15px 0;">
                    Items
                </h3>
                <div id="po-items">
                    <div class="cart-row">
                        <select name="product_id[]" required style="flex:2;">
                            {% for p in products %}
                                <option value="{{ p[0] }}">
                                    {{ p[2] }}
                                </option>
                            {% endfor %}
                        </select>
                        <input type="number" name="quantity[]" placeholder="Qty" min="1" required style="flex:1;">
                        <input type="number" step="0.01" name="unit_cost[]" placeholder="Unit Cost" required style="flex:1;">
                    </div>
                </div>
                <button type="button" class="btn secondary" data-add-row="1">
                    + Add Item
                </button>
                <br>
                <br>
                <button class="btn success" type="submit">
                    Create Purchase Order
                </button>
            </form>
        </div>
    <script nonce="{{ csp_nonce }}">
function addRow(){
    const row = document.querySelector('#po-items .cart-row').cloneNode(true);
    row.querySelectorAll('input').forEach(i => i.value = '');
    document.getElementById('po-items').appendChild(row);
}
document.querySelectorAll('[data-add-row="1"]').forEach(function (el) { el.addEventListener('click', addRow); });
</script>
    </div>
{% endblock %}
