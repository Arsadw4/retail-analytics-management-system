{% extends 'layouts/admin_shell.html' %}
{% block page_content %}
    <div class="legacy-page">
        <div class="container" style="max-width:600px;">
            <div class="header">
                <h1>
                    Edit Supplier
                </h1>
                <a href="/admin/suppliers" class="btn secondary">
                    Back
                </a>
            </div>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label>
                        Supplier Name
                    </label>
                    <input type="text" name="supplier_name" value="{{ supplier[1] }}" required>
                </div>
                <div class="form-group">
                    <label>
                        Contact Person
                    </label>
                    <input type="text" name="contact_person" value="{{ supplier[2] or '' }}">
                </div>
                <div class="form-group">
                    <label>
                        Phone
                    </label>
                    <input type="text" name="phone" value="{{ supplier[3] or '' }}">
                </div>
                <div class="form-group">
                    <label>
                        Email
                    </label>
                    <input type="email" name="email" value="{{ supplier[4] or '' }}">
                </div>
                <div class="form-group">
                    <label>
                        Address
                    </label>
                    <input type="text" name="address" value="{{ supplier[5] or '' }}">
                </div>
                <div class="form-group">
                    <label>
                        GST Number
                    </label>
                    <input type="text" name="gst_number" value="{{ supplier[6] or '' }}">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" name="is_active" style="width:auto;display:inline;" {% if supplier[8] %}checked{% endif %}>
                        Active
                    </label>
                </div>
                <button class="btn success" type="submit">
                    Update Supplier
                </button>
            </form>
        </div>
    </div>
{% endblock %}
