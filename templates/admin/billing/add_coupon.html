{% extends 'layouts/admin_shell.html' %}
{% block page_content %}
    <div class="legacy-page">
        <div class="container" style="max-width:600px;">
            <div class="header">
                <h1>
                    Add Coupon
                </h1>
                <a href="/admin/coupons" class="btn secondary">
                    Back
                </a>
            </div>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label>
                        Coupon Code
                    </label>
                    <input type="text" name="code" required>
                </div>
                <div class="form-group">
                    <label>
                        Discount Type
                    </label>
                    <select name="discount_type">
                        <option value="flat">
                            Flat Amount
                        </option>
                        <option value="percent">
                            Percentage
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label>
                        Discount Value
                    </label>
                    <input type="number" step="0.01" name="discount_value" required>
                </div>
                <div class="form-group">
                    <label>
                        Minimum Purchase Amount
                    </label>
                    <input type="number" step="0.01" name="min_purchase_amount" value="0">
                </div>
                <div class="form-group">
                    <label>
                        Valid From
                    </label>
                    <input type="date" name="valid_from">
                </div>
                <div class="form-group">
                    <label>
                        Valid Until
                    </label>
                    <input type="date" name="valid_until">
                </div>
                <div class="form-group">
                    <label>
                        Usage Limit (blank = unlimited)
                    </label>
                    <input type="number" name="usage_limit">
                </div>
                <button class="btn success" type="submit">
                    Save Coupon
                </button>
            </form>
        </div>
    </div>
{% endblock %}
