{% extends 'layouts/admin_shell.html' %}
{% block page_content %}
    <div class="legacy-page">
        <div class="container" style="max-width:600px;">
            <div class="header">
                <h1>
                    Request Leave
                </h1>
                <a href="/admin/hr/leaves" class="btn secondary">
                    Back
                </a>
            </div>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label>
                        Employee
                    </label>
                    <select name="employee_id" required>
                        {% for e in employees %}
                            <option value="{{ e[0] }}">
                                {{ e[1] }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>
                        Leave Type
                    </label>
                    <select name="leave_type">
                        <option value="sick">
                            Sick
                        </option>
                        <option value="casual">
                            Casual
                        </option>
                        <option value="earned">
                            Earned
                        </option>
                        <option value="unpaid">
                            Unpaid
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label>
                        Start Date
                    </label>
                    <input type="date" name="start_date" required>
                </div>
                <div class="form-group">
                    <label>
                        End Date
                    </label>
                    <input type="date" name="end_date" required>
                </div>
                <div class="form-group">
                    <label>
                        Reason
                    </label>
                    <input type="text" name="reason">
                </div>
                <button class="btn success">
                    Submit Request
                </button>
            </form>
        </div>
    </div>
{% endblock %}
