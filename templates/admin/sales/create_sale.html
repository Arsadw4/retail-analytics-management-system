{% extends 'layouts/admin_shell.html' %}
{% block page_content %}
    <div class="legacy-page">
        <div class="container">
            <div class="sale-card">
                <h1>
                    Create Sale
                </h1>
                <p class="subtitle">
                    Create and manage customer sales transactions
                </p>
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="form-group">
                        <label>
                            Customer
                        </label>
                        <select name="customer_id" required>
                            {% for customer in customers %}
                                <option value="{{ customer[0] }}">
                                    {{ customer[1] }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>
                            Product
                        </label>
                        <select name="product_id" required>
                            {% for product in products %}
                                <option value="{{ product[0] }}">
                                    {{ product[1] }} (₹{{ product[2] }})
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>
                            Quantity
                        </label>
                        <input
                type="number"
                name="quantity"
                min="1"
                placeholder="Enter Quantity"
                required>
                    </div>
                    <button type="submit" class="btn">
                        Create Sale
                    </button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
