<!DOCTYPE html>
    <html>
        <head>
            <meta name="csrf-token" content="{{ csrf_token() }}">
        <script nonce="{{ csp_nonce }}">(function(){try{var t=localStorage.getItem("ra_theme");if(t!=="light"){document.documentElement.dataset.theme="dark";}}catch(e){}})();</script>
            <title>
                {% block title %}
                {% endblock %}
            </title>
            {% block css %}
            {% endblock %}
            <link rel="stylesheet" href="{{ url_for('static', filename='css/global_theme.css') }}">
        </head>
        <body class="app-shell">
            {% block sidebar %}
            {% endblock %}
            {% block content %}
            {% endblock %}
        <script src="{{ url_for('static', filename='js/csrf-delete.js') }}"></script>
        <script src="{{ url_for('static', filename='js/ui-actions.js') }}"></script>
        <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
        </body>
    </html>
