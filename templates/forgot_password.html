<!DOCTYPE html>
    <html>
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script nonce="{{ csp_nonce }}">(function(){try{if(localStorage.getItem("ra_theme")==="dark"){document.documentElement.dataset.theme="dark";}}catch(e){}})();</script>
            <title>
                Forgot Password
            </title>
            <link rel="stylesheet" href="{{ url_for('static', filename='css/forgot_password.css') }}">
            <link rel="stylesheet" href="{{ url_for('static', filename='css/global_theme.css') }}">
        </head>
        <body>
            <button class="auth-theme-toggle" data-theme-toggle type="button" aria-label="Switch to dark mode">
                <span data-theme-icon>
                    ☾
                </span>
            </button>
            <div class="forgot-container">
                <div class="forgot-card">
                    <div class="forgot-icon">
                        🔒
                    </div>
                    <h1>
                        Forgot Password?
                    </h1>
                    <p>
                        Enter your registered email address.
                        We will help you recover your account.
                    </p>
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <input
                type="email"
                name="email"
                placeholder="Enter Email Address"
                required
            >
                        <button type="submit">
                            Recover Account
                        </button>
                    </form>
                    <a href="/login" class="back-link">
                        ← Back To Login
                    </a>
                </div>
            </div>
        <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
        </body>
    </html>
