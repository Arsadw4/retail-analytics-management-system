<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
        <script nonce="{{ csp_nonce }}">(function(){try{if(localStorage.getItem("ra_theme")==="dark"){document.documentElement.dataset.theme="dark";}}catch(e){}})();</script>
            <title>
                Password Update Required
            </title>
            <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
            <link rel="stylesheet" href="{{ url_for('static', filename='css/global_theme.css') }}">
        </head>
        <body>
            <button class="auth-theme-toggle" data-theme-toggle type="button" aria-label="Switch to dark mode">
                <span data-theme-icon>
                    ☾
                </span>
            </button>
            <div class="login-container">
                <div class="login-card">
                    <h2>
                        Password Update Required
                    </h2>
                    <p class="subtitle">
                        Your password has expired. Please set a new one to continue.
                    </p>
                    {% with messages = get_flashed_messages() %}
                        {% if messages %}
                            <div class="error-message">
                                {{ messages[0] }}
                            </div>
                        {% endif %}
                    {% endwith %}
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <input type="password" name="new_password" placeholder="New Password" required>
                        <input type="password" name="confirm_password" placeholder="Confirm New Password" required>
                        <button type="submit">
                            Update Password
                        </button>
                    </form>
                </div>
            </div>
        <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
        </body>
    </html>
